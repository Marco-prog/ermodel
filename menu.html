<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sito Web</title>
  <style>
    /* Resetta i margini del browser ed elimina le barre di scorrimento doppie */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Evita scorrimenti inutili sulla pagina principale */
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }

    /* Stile della barra dei bottoni */
    .navbar { 
      background-color: #FBFBF9; 
      padding: 10px; 
      text-align: center; 
      flex-shrink: 0; /* Impedisce alla barra di schiacciarsi */
      box-shadow: 1 2px 5px rgba(0,0,0,0.3);
      z-index: 10;
    }

    .btn { 
      display: inline-block; 
      background-color: #FFFFFF; 
      color: black; 
      padding: 5px 20px; 
      margin: 0 5px; 
      text-decoration: none; 
      border-radius: 5px; 
      cursor: pointer; 
      border: 0.5px solid gray; 
      font-size: 10px;
    }
    .btn:hover { background-color: #0056b3; }

    /* L'iframe ora è forzato a occupare tutto lo spazio rimanente */
    #finestra-contenuto { 
      flex-grow: 1;    /* Si allunga fino al fondo del browser */
      width: 100%;     /* Prende tutta la larghezza */
      border: none;    /* Rimuove il bordo predefinito dell'iframe */
      margin: 0;
      padding: 0;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Barra con i bottoni -->
  <nav class="navbar">
    <!-- Usiamo il target per puntare al name dell'iframe sotto -->
    <a href="er-editor.html" target="contenuto" class="btn">Modello ER</a>
    <a href="modello_logico_F.html" target="contenuto" class="btn">Modello Logico</a>
  </nav>

  <!-- Finestra iframe a tutto schermo (carica la pagina 1 di default) -->
  <iframe id="finestra-contenuto" name="contenuto" src="er-editor.html"></iframe>

</body>
</html>
