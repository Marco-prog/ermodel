
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Modello Logico + SQL da JSON ER</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        #drop-zone {
            border: 2px dashed #3498db;
            border-radius: 6px;
            padding: 30px;
            text-align: center;
            background: #f8fafc;
            color: #7f8c8d;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        #drop-zone.hover {
            background-color: #e8f4fd;
            border-color: #2980b9;
            color: #2980b9;
        }
        #file-input {
            display: none;
        }
        .error {
            color: #e74c3c;
            background: #fceae9;
            padding: 10px;
            border-left: 4px solid #e74c3c;
            margin-bottom: 20px;
            border-radius: 4px;
            display: none;
        }
        .result-section {
            margin-top: 25px;
            display: none;
        }
        .relation-card {
            background: #fafbfc;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .relation-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .relation-schema {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #eaecef;
        }
        .pk {
            text-decoration: underline;
            font-weight: bold;
            color: #c0392b;
        }
        .fk {
            border-bottom: 1px dashed #27ae60;
            color: #27ae60;
        }
        .pk.fk {
            text-decoration: underline;
            border-bottom: 1px dashed #d35400;
            color: #d35400;
        }
        .assoc-attr {
            color: #8e44ad;
            font-style: italic;
        }
        .sql-section {
            margin-top: 30px;
        }
        textarea {
            width: 100%;
            height: 250px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #282c34;
            color: #abb2bf;
            resize: vertical;
            box-sizing: border-box;
        }
        .btn-copy {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-copy:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Generatore Modello Logico &amp; SQL DDL</h1>
    <p>Trascina il file JSON ER per includere anche gli <strong>attributi delle associazioni</strong> nel Modello Logico e nello script SQL.</p>
    
    <div id="drop-zone">
        Trascina qui il file JSON oppure <strong>clicca per cercarlo</strong>
        <input type="file" id="file-input" accept=".json">
    </div>

    <div id="error-message" class="error"></div>

    <div id="result-container" class="result-section">
        <h2>Modello Logico Relazionale</h2>
        <div id="tables-list"></div>

        <div class="sql-section">
            <h2>Codice SQL DDL (MySQL / Standard)</h2>
            <textarea id="sql-output" readonly></textarea>
            <button class="btn-copy" id="copy-btn">Copia Codice SQL</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const errorMessage = document.getElementById('error-message');
    const resultContainer = document.getElementById('result-container');
    const tablesList = document.getElementById('tables-list');
    const sqlOutput = document.getElementById('sql-output');
    const copyBtn = document.getElementById('copy-btn');

    // Drag & Drop con Vanilla JS blindato
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    dropZone.addEventListener('dragover', () => dropZone.classList.add('hover'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
    dropZone.addEventListener('drop', (e) => {
        dropZone.classList.remove('hover');
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length > 0) processFile(files[0]);
    });

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', function() {
        if (this.files.length > 0) processFile(this.files[0]);
    });

    function processFile(file) {
        errorMessage.style.display = 'none';
        errorMessage.innerText = '';
        resultContainer.style.style = 'none';
        resultContainer.style.display = 'none';

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                generateModel(data);
            } catch (err) {
                showError("Errore nel parsing del file JSON. Assicurati che sia valido.");
            }
        };
        reader.readAsText(file);
    }

    function showError(msg) {
        errorMessage.innerText = msg;
        errorMessage.style.display = 'block';
    }

    function generateModel(data) {
        const entities = {};
        const associations = {};
        const tables = {};
        const assocAttributes = {}; // a1 -> [{name: '...', pk: false}]

        // 1. Inizializza Entità
        if (data.entities) {
            data.entities.forEach(e => {
                entities[e.id] = { id: e.id, name: e.name, pks: [], fields: [] };
                tables[e.name] = { pks: [], fks: [], fields: [], assocFields: [], fDetails: [] };
            });
        }

        // 2. Inizializza Associazioni
        if (data.associations) {
            data.associations.forEach(a => {
                associations[a.id] = { id: a.id, name: a.name, links: [] };
                assocAttributes[a.id] = [];
            });
        }

        // 3. Dividi gli attributi (Entità o Associazioni)
        if (data.attributes) {
            data.attributes.forEach(attr => {
                if (entities[attr.owner]) {
                    const entName = entities[attr.owner].name;
                    if (attr.pk) {
                        entities[attr.owner].pks.push(attr.name);
                        tables[entName].pks.push(attr.name);
                    } else {
                        entities[attr.owner].fields.push(attr.name);
                        tables[entName].fields.push(attr.name);
                    }
                } else if (assocAttributes[attr.owner] !== undefined) {
                    // È un attributo di un'associazione!
                    assocAttributes[attr.owner].push(attr.name);
                }
            });
        }

        // 4. Collega i Link alle Associazioni
        if (data.links) {
            data.links.forEach(l => {
                if (associations[l.assoc]) {
                    associations[l.assoc].links.push({
                        entityId: l.entity,
                        many: l.many
                    });
                }
            });
        }

        // 5. Elabora Regole Relazionali + Spostamento Attributi Associazione
        Object.keys(associations).forEach(assocId => {
            const assoc = associations[assocId];
            const links = assoc.links;
            const attrs = assocAttributes[assocId] || [];

            if (links.length === 2) {
                const l1 = links[0];
                const l2 = links[1];
                const ent1 = entities[l1.entityId];
                const ent2 = entities[l2.entityId];

                if (!ent1 || !ent2) return;

                // Caso A: Associazione 1 a N
                if (l1.many !== l2.many) {
                    const manyLink = l1.many ? l1 : l2;
                    const oneLink = l1.many ? l2 : l1;
                    
                    const manyEnt = entities[manyLink.entityId];
                    const oneEnt = entities[oneLink.entityId];

                    // La FK migra nel lato N
                    oneEnt.pks.forEach(pk => {
                        const fkName = `${oneEnt.name}_${pk}`;
                        tables[manyEnt.name].fks.push(fkName);
                        tables[manyEnt.name].fields.push(fkName);
                        tables[manyEnt.name].fDetails.push({ fk: fkName, refTable: oneEnt.name, refPk: pk });
                    });

                    // ANCHE GLI ATTRIBUTI dell'associazione migrano nel lato N
                    attrs.forEach(attrName => {
                        tables[manyEnt.name].assocFields.push(attrName);
                        tables[manyEnt.name].fields.push(attrName);
                    });
                } 
                // Caso B: Associazione N a N
                else if (l1.many && l2.many) {
                    const newTableName = `${ent1.name}_${ent2.name}`;
                    tables[newTableName] = { pks: [], fks: [], fields: [], assocFields: [], fDetails: [] };

                    // Entrambe le PK migrano nella tabella ponte come PK e FK
                    [ent1, ent2].forEach(ent => {
                        ent.pks.forEach(pk => {
                            const fkName = `${ent.name}_${pk}`;
                            tables[newTableName].pks.push(fkName);
                            tables[newTableName].fks.push(fkName);
                            tables[newTableName].fields.push(fkName);
                            tables[newTableName].fDetails.push({ fk: fkName, refTable: ent.name, refPk: pk });
                        });
                    });

                    // GLI ATTRIBUTI dell'associazione diventano colonne della tabella ponte
                    attrs.forEach(attrName => {
                        tables[newTableName].assocFields.push(attrName);
                        tables[newTableName].fields.push(attrName);
                    });
                }
            }
        });

        renderOutput(tables);
    }

    function renderOutput(tables) {
        tablesList.innerHTML = '';
        let sqlScript = '';

        Object.keys(tables).forEach(tableName => {
            const table = tables[tableName];
            
            // Ordine visualizzazione modello logico: PK, normali, FK, attributi associazione
            const uniqueFields = [];
            const addUnique = (f) => { if(!uniqueFields.includes(f)) uniqueFields.push(f); };
            
            table.pks.forEach(addUnique);
            table.fields.forEach(f => {
                if(!table.pks.includes(f) && !table.fks.includes(f) && !table.assocFields.includes(f)) addUnique(f);
            });
            table.fks.forEach(f => { if(!table.pks.includes(f)) addUnique(f); });
            table.assocFields.forEach(addUnique);

            // Generazione HTML Spans per modello logico
            const fieldSpans = uniqueFields.map(field => {
                let classes = [];
                let titleAttr = "";
                
                if (table.pks.includes(field)) classes.push('pk');
                if (table.fks.includes(field)) classes.push('fk');
                if (table.assocFields.includes(field)) classes.push('assoc-attr');
                
                if (classes.includes('pk') && classes.includes('fk')) titleAttr = 'Chiave Primaria / Esterna';
                else if (classes.includes('pk')) titleAttr = 'Chiave Primaria (PK)';
                else if (classes.includes('fk')) titleAttr = 'Chiave Esterna (FK)';
                if (classes.includes('assoc-attr')) titleAttr += ' (Attributo Associazione)';

                return `<span class="${classes.join(' ')}" title="${titleAttr}">${field}</span>`;
            });

            const htmlRow = `
                <div class="relation-card">
                    <div class="relation-name">${tableName}</div>
                    <div class="relation-schema">
                        <strong>${tableName}</strong> (${fieldSpans.join(', ')})
                    </div>
                </div>
            `;
            tablesList.insertAdjacentHTML('beforeend', htmlRow);

            // Generazione SQL DDL per questa tabella
            sqlScript += `CREATE TABLE ${tableName} (\n`;
            
            const sqlColumns = [];
            
            // Campi colonne
            uniqueFields.forEach(field => {
                let colDef = `    ${field} INT`;
                if (table.assocFields.includes(field)) {
                    colDef = `    ${field} VARCHAR(255)`; // Tipo generico per attributi relazione
                }
                
                if (table.pks.includes(field)) {
                    // Auto increment solo se NON è una chiave migrata (cioè non è una FK contemporaneamente)
                    if (!table.fks.includes(field)) {
                        colDef += " NOT NULL AUTO_INCREMENT";
                    } else {
                        colDef += " NOT NULL";
                    }
                } else {
                    colDef += " NOT NULL";
                }
                sqlColumns.push(colDef);
            });

            // Vincolo Primary Key
            if (table.pks.length > 0) {
                sqlColumns.push(`    PRIMARY KEY (${table.pks.join(', ')})`);
            }

            // Vincoli Foreign Key
            table.fDetails.forEach(fd => {
                sqlColumns.push(`    FOREIGN KEY (${fd.fk}) REFERENCES ${fd.refTable}(${fd.refPk}) ON DELETE CASCADE ON UPDATE CASCADE`);
            });

            sqlScript += sqlColumns.join(',\n') + `\n);\n\n`;
        });

        sqlOutput.value = sqlScript.trim();
        resultContainer.style.display = 'block';
    }

    // Copia in Clipboard
    copyBtn.addEventListener('click', function() {
        sqlOutput.select();
        document.execCommand('copy');
        alert('Codice SQL copiato negli appunti!');
    });
});
</script>
</body>
</html>
